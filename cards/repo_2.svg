<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 120" width="392" height="120"><defs><style> text { font-family: 'BrandFont', monospace, sans-serif; fill: #D6DEE7; } .bg { fill: #0B1016; } .surface { fill: #111A24; } .accent { fill: #79AEB8; } .muted { fill: #D6DEE7; opacity: .7; } .border { fill: none; stroke: #273442; stroke-width: 1; } .ascii-portrait { font-family: monospace; fill: #79AEB8; } .card-container { animation: cardIn .75s cubic-bezier(.2,.8,.2,1) 1.14s both; } @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } } .ascii-row { opacity: 0; animation: asciiReveal .18s ease-out both; } @keyframes asciiReveal { to { opacity: 1; } } @media (prefers-reduced-motion: reduce) { .card-container { animation: none !important; opacity: 1; transform: none; } .ascii-row { animation: none !important; opacity: 1; } animate, animateTransform { display: none !important; } }</style></defs><g class="card-container"><rect width="392" height="120" rx="4" class="bg"/><rect x=".5" y=".5" width="391" height="119" rx="4" class="border"/><rect x="10" y="10" width="372" height="100" rx="4" class="surface" stroke="#273442" stroke-width="1"/><text x="28" y="43" font-size="18" font-weight="bold" class="accent">PyLLM</text><text x="28" y="69" font-size="12">Local LLM integrations and exploratory tools.</text><text x="364" y="91" font-size="11" text-anchor="end" class="muted">AI / ML</text></g></svg>