<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 96" width="880" height="96" role="img" aria-label="Selected work and featured repositories"><title>Selected work and featured repositories</title><defs><style> text { font-family: 'BrandFont', system-ui, sans-serif; } .serif { font-family: Georgia, 'Times New Roman', serif; } .mono { font-family: 'SFMono-Regular', Consolas, monospace; } .paper { fill: #F3F3F1; } .ink { fill: #111111; } .soft { fill: #3A3A3C; } .muted { fill: #6E6E73; } .blue { fill: #2F55FF; } .rule { stroke: #DCDCD7; } .ascii-portrait { font-family: 'SFMono-Regular', Consolas, monospace; } .card-container { opacity: 0; animation: rise .75s cubic-bezier(.2,.8,.2,1) 6.00s both; } @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } } .fade { opacity: 0; animation: fadeIn .45s ease-out both; } @keyframes fadeIn { to { opacity: 1; } } .grow { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: growUp .65s cubic-bezier(.2,.8,.2,1) both; } @keyframes growUp { to { transform: scaleY(1); } } @media (prefers-reduced-motion: reduce) { .card-container, .fade, .grow { animation: none !important; opacity: 1 !important; transform: none !important; } .ascii-mask { width: 460.8px !important; } .ascii-cursor, animate, animateTransform { display: none !important; } }</style></defs><g class="card-container"><rect width="880" height="96" rx="14" fill="#F3F3F1"/><text x="40" y="61" class="serif" font-size="39" fill="#111111">Selected work, <tspan font-style="italic" fill="#2F55FF">in progress.</tspan></text><text x="838" y="57" text-anchor="end" class="mono" font-size="10" letter-spacing="1" fill="#6E6E73">FEATURED REPOSITORIES</text></g></svg>