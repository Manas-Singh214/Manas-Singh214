<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 120" width="392" height="120"><defs><style> text { font-family: 'BrandFont', monospace, sans-serif; fill: #EAE0D5; } .bg { fill: #1C1714; } .surface { fill: #2A231D; } .accent { fill: #C49A6C; } .muted { fill: #EAE0D5; opacity: .7; } .ascii { font-family: monospace; } .card-container { animation: cardIn .75s cubic-bezier(.2,.8,.2,1) 1.04s both; } @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } } @media (prefers-reduced-motion: reduce) { .card-container { animation: none !important; opacity: 1; transform: none; } animate, animateTransform { display: none !important; } }</style><pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3A3129"/></pattern></defs><g class="card-container"><rect width="392" height="120" rx="12" class="bg"/><rect width="392" height="120" rx="12" fill="url(#dotGrid)"/><rect x="10" y="10" width="372" height="100" rx="8" class="surface" stroke="#3A3129" stroke-width="2"/><text x="28" y="43" font-size="16" font-weight="bold" class="accent">Cashflow Intelligence</text><text x="28" y="69" font-size="11">Banking analytics and financial data pipelines.</text><text x="364" y="91" font-size="10" text-anchor="end" class="muted">PYTHON</text></g></svg>