<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 120" width="392" height="120"><defs><style> text { font-family: 'BrandFont', monospace, sans-serif; fill: #EAE0D5; } .bg { fill: #1C1714; rx: 12px; } .surface { fill: #2A231D; rx: 8px; } .card-container { animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; animation-delay: 1.1s; opacity: 0; transform: translateY(20px); } @keyframes slideUp { to { opacity: 1; transform: translateY(0); } } @media (prefers-reduced-motion: reduce) { .card-container { animation: none; opacity: 1; transform: none; } }</style><pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3A3129"/></pattern></defs><g class="card-container"><rect width="392" height="120" class="bg"/><rect width="392" height="120" fill="url(#dotGrid)" rx="12px"/><rect x="10" y="10" width="372" height="100" class="surface" stroke="#3A3129" stroke-width="2"/><text x="30" y="45" font-size="18" font-weight="bold" fill="#C49A6C">Hand Gestures</text><text x="30" y="70" font-size="12">Computer vision model for spatial hand tracking.</text><text x="340" y="45" font-size="12" text-anchor="end" fill="#3A3129">OpenCV</text></g></svg>