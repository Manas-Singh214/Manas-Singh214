<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" width="440" height="180" role="img" aria-label="Featured repository: Hand Gestures"><title>Featured repository: Hand Gestures</title><defs><style> text { font-family: 'BrandFont', system-ui, sans-serif; } .serif { font-family: Georgia, 'Times New Roman', serif; } .mono { font-family: 'SFMono-Regular', Consolas, monospace; } .paper { fill: #F3F3F1; } .ink { fill: #111111; } .soft { fill: #3A3A3C; } .muted { fill: #6E6E73; } .blue { fill: #2F55FF; } .rule { stroke: #DCDCD7; } .ascii-portrait { font-family: 'SFMono-Regular', Consolas, monospace; } .card-container { opacity: 0; animation: rise .75s cubic-bezier(.2,.8,.2,1) 6.64s both; } @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } } .fade { opacity: 0; animation: fadeIn .45s ease-out both; } @keyframes fadeIn { to { opacity: 1; } } .grow { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: growUp .65s cubic-bezier(.2,.8,.2,1) both; } @keyframes growUp { to { transform: scaleY(1); } } @media (prefers-reduced-motion: reduce) { .card-container, .fade, .grow { animation: none !important; opacity: 1 !important; transform: none !important; } .ascii-mask { width: 460.8px !important; } .ascii-cursor, animate, animateTransform { display: none !important; } }</style></defs><g class="card-container"><rect x="4" y="4" width="432" height="172" rx="14" fill="#F3F3F1"/><rect x="4" y="4" width="6" height="172" rx="3" fill="#EF3B2D"/><text x="30" y="46" class="serif" font-size="25" fill="#111111">Hand Gestures</text><text x="30" y="79" font-size="13" fill="#3A3A3C">Computer vision for spatial hand tracking.</text><line x1="30" y1="112" x2="410" y2="112" stroke="#DCDCD7"/><text x="30" y="148" class="mono" font-size="10" letter-spacing="1" fill="#6E6E73">OPENCV</text><path d="M398 137h12v12m0-12-14 14" fill="none" stroke="#2F55FF" stroke-width="1.5"/></g></svg>