<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 108" width="256" height="108"><defs><style> text { font-family: 'BrandFont', monospace, sans-serif; fill: #D6DEE7; } .bg { fill: #0B1016; } .surface { fill: #111A24; } .accent { fill: #79AEB8; } .muted { fill: #D6DEE7; opacity: .7; } .border { fill: none; stroke: #273442; stroke-width: 1; } .ascii-portrait { font-family: monospace; fill: #79AEB8; } .card-container { animation: cardIn .75s cubic-bezier(.2,.8,.2,1) 0.30s both; } @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } } .ascii-row { opacity: 0; animation: asciiReveal .18s ease-out both; } @keyframes asciiReveal { to { opacity: 1; } } @media (prefers-reduced-motion: reduce) { .card-container { animation: none !important; opacity: 1; transform: none; } .ascii-row { animation: none !important; opacity: 1; } animate, animateTransform { display: none !important; } }</style></defs><g class="card-container"><rect width="256" height="108" rx="4" class="bg"/><rect x=".5" y=".5" width="255" height="107" rx="4" class="border"/><rect x="8" y="8" width="240" height="92" rx="4" class="surface"/><text x="128" y="44" font-size="18" font-weight="bold" text-anchor="middle" class="accent">Data &amp; Analytics</text><text x="128" y="72" font-size="11" text-anchor="middle">PYTHON | SQL | VISUALIZATION</text></g></svg>