<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160"><defs><style> text { font-family: 'BrandFont', monospace, sans-serif; fill: #D6DEE7; } .bg { fill: #0B1016; } .surface { fill: #111A24; } .accent { fill: #79AEB8; } .muted { fill: #D6DEE7; opacity: .7; } .border { fill: none; stroke: #273442; stroke-width: 1; } .ascii-portrait { font-family: monospace; fill: #79AEB8; } .card-container { animation: cardIn .75s cubic-bezier(.2,.8,.2,1) 0.00s both; } @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } } .ascii-row { opacity: 0; animation: asciiReveal .18s ease-out both; } @keyframes asciiReveal { to { opacity: 1; } } @media (prefers-reduced-motion: reduce) { .card-container { animation: none !important; opacity: 1; transform: none; } .ascii-row { animation: none !important; opacity: 1; } animate, animateTransform { display: none !important; } }</style></defs><g class="card-container"><rect width="800" height="160" rx="4" class="bg"/><rect x=".5" y=".5" width="799" height="159" rx="4" class="border"/><circle cx="80" cy="80" r="50" fill="#2A231D"/><defs><clipPath id="portraitClip"><circle cx="80" cy="80" r="50"/></clipPath></defs><text x="80" y="91" font-size="30" text-anchor="middle" class="accent">MS</text><text x="160" y="73" font-size="34" font-weight="bold" class="accent">Manas Singh</text><text x="160" y="111" font-size="17">Data analytics, machine learning, visualization &amp; UI/UX</text><text x="160" y="139" font-size="13" class="muted">Ideas to insight, built with purpose.</text></g></svg>