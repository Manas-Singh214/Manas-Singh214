<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160"><defs><style> text { font-family: 'BrandFont', monospace, sans-serif; fill: #EAE0D5; } .bg { fill: #1C1714; rx: 12px; } .surface { fill: #2A231D; rx: 8px; } .card-container { animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; animation-delay: 0.1s; opacity: 0; transform: translateY(20px); } @keyframes slideUp { to { opacity: 1; transform: translateY(0); } } @media (prefers-reduced-motion: reduce) { .card-container { animation: none; opacity: 1; transform: none; } }</style><pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3A3129"/></pattern></defs><g class="card-container"><rect width="800" height="160" class="bg"/><rect width="800" height="160" fill="url(#dotGrid)" rx="12px"/><circle cx="80" cy="80" r="50" fill="#2A231D"/><image href="" x="30" y="30" width="100" height="100" clip-path="inset(0% round 50px)" /><text x="160" y="70" font-size="32" font-weight="bold" fill="#C49A6C">Manas Singh</text><text x="160" y="105" font-size="18">Data Analyst &amp; Software Developer</text><text x="160" y="135" font-size="14" fill="#3A3129">"Where mathematics reveals patterns, design gives them purpose."</text></g></svg>