<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160"><defs><style> text { font-family: 'BrandFont', monospace, sans-serif; fill: #EAE0D5; } .bg { fill: #1C1714; } .surface { fill: #2A231D; } .accent { fill: #C49A6C; } .muted { fill: #EAE0D5; opacity: .7; } .ascii { font-family: monospace; } .card-container { animation: cardIn .75s cubic-bezier(.2,.8,.2,1) 0.00s both; } @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } } @media (prefers-reduced-motion: reduce) { .card-container { animation: none !important; opacity: 1; transform: none; } animate, animateTransform { display: none !important; } }</style><pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3A3129"/></pattern></defs><g class="card-container"><rect width="800" height="160" rx="12" class="bg"/><rect width="800" height="160" rx="12" fill="url(#dotGrid)"/><circle cx="80" cy="80" r="50" fill="#2A231D"/><defs><clipPath id="portraitClip"><circle cx="80" cy="80" r="50"/></clipPath></defs><text x="80" y="91" font-size="30" text-anchor="middle" class="accent">MS</text><text x="160" y="73" font-size="34" font-weight="bold" class="accent">Manas Singh</text><text x="160" y="111" font-size="17">Data analytics, machine learning, visualization &amp; UI/UX</text><text x="160" y="139" font-size="13" class="muted">Ideas to insight, built with purpose.</text></g></svg>