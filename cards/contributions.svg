<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200"><defs><style> text { font-family: 'BrandFont', monospace, sans-serif; fill: #EAE0D5; } .bg { fill: #1C1714; rx: 12px; } .surface { fill: #2A231D; rx: 8px; } .card-container { animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; animation-delay: 0.6s; opacity: 0; transform: translateY(20px); } @keyframes slideUp { to { opacity: 1; transform: translateY(0); } } @media (prefers-reduced-motion: reduce) { .card-container { animation: none; opacity: 1; transform: none; } }</style><pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3A3129"/></pattern></defs><g class="card-container"><rect width="800" height="200" class="bg"/><rect width="800" height="200" fill="url(#dotGrid)" rx="12px"/><rect x="20" y="20" width="760" height="160" class="surface"/><text x="40" y="55" font-size="20" font-weight="bold">Contribution Metrics</text><text x="40" y="90" font-size="14">Current Streak: <tspan fill="#C49A6C">12 Days</tspan></text><text x="40" y="120" font-size="14">Active Days: <tspan fill="#C49A6C">145</tspan></text><text x="40" y="150" font-size="14">Busiest Day: <tspan fill="#C49A6C">Tuesday</tspan></text><path d="M 250 120 Q 300 50 350 120 T 450 120 T 550 120 T 650 100 T 750 140" fill="none" stroke="#C49A6C" stroke-width="4" stroke-dasharray="1000" stroke-dashoffset="1000"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="2s" fill="freeze" /></path></g></svg>