<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 108" width="256" height="108"><defs><style> text { font-family: 'BrandFont', monospace, sans-serif; fill: #EAE0D5; } .bg { fill: #1C1714; } .surface { fill: #2A231D; } .accent { fill: #C49A6C; } .muted { fill: #EAE0D5; opacity: .7; } .ascii { font-family: monospace; } .card-container { animation: cardIn .75s cubic-bezier(.2,.8,.2,1) 0.46s both; } @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } } @media (prefers-reduced-motion: reduce) { .card-container { animation: none !important; opacity: 1; transform: none; } animate, animateTransform { display: none !important; } }</style><pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3A3129"/></pattern></defs><g class="card-container"><rect width="256" height="108" rx="12" class="bg"/><rect width="256" height="108" rx="12" fill="url(#dotGrid)"/><rect x="8" y="8" width="240" height="92" rx="8" class="surface"/><text x="128" y="44" font-size="15" font-weight="bold" text-anchor="middle" class="accent">Software &amp; Design</text><text x="128" y="71" font-size="10" text-anchor="middle">FASTAPI | REACT | UI/UX</text></g></svg>