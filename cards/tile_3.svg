<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 100" width="256" height="100"><defs><style> text { font-family: 'BrandFont', monospace, sans-serif; fill: #EAE0D5; } .bg { fill: #1C1714; rx: 12px; } .surface { fill: #2A231D; rx: 8px; } .card-container { animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; animation-delay: 0.5s; opacity: 0; transform: translateY(20px); } @keyframes slideUp { to { opacity: 1; transform: translateY(0); } } @media (prefers-reduced-motion: reduce) { .card-container { animation: none; opacity: 1; transform: none; } }</style><pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3A3129"/></pattern></defs><g class="card-container"><rect width="256" height="100" class="bg"/><rect width="256" height="100" fill="url(#dotGrid)" rx="12px"/><rect x="10" y="10" width="236" height="80" class="surface"/><text x="128" y="45" font-size="16" font-weight="bold" text-anchor="middle" fill="#C49A6C">BPIT IT '28</text><text x="128" y="70" font-size="12" text-anchor="middle">Education</text></g></svg>