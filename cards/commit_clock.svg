<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120"><defs><style> text { font-family: 'BrandFont', monospace, sans-serif; fill: #D6DEE7; } .bg { fill: #0B1016; } .surface { fill: #111A24; } .accent { fill: #79AEB8; } .muted { fill: #D6DEE7; opacity: .7; } .border { fill: none; stroke: #273442; stroke-width: 1; } .ascii-portrait { font-family: monospace; fill: #79AEB8; } .card-container { animation: cardIn .75s cubic-bezier(.2,.8,.2,1) 0.62s both; } @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } } .ascii-row { opacity: 0; animation: asciiReveal .18s ease-out both; } @keyframes asciiReveal { to { opacity: 1; } } @media (prefers-reduced-motion: reduce) { .card-container { animation: none !important; opacity: 1; transform: none; } .ascii-row { animation: none !important; opacity: 1; } animate, animateTransform { display: none !important; } }</style></defs><g class="card-container"><rect width="800" height="120" rx="4" class="bg"/><rect x=".5" y=".5" width="799" height="119" rx="4" class="border"/><rect x="16" y="16" width="768" height="88" rx="4" class="surface"/><circle cx="66" cy="60" r="32" fill="none" stroke="#79AEB8" stroke-width="2"/><line x1="66" y1="60" x2="66" y2="43" stroke="#D6DEE7" stroke-width="3" stroke-linecap="round" transform="rotate(5.0 66 60)"/><line x1="66" y1="60" x2="66" y2="35" stroke="#79AEB8" stroke-width="2" stroke-linecap="round" transform="rotate(60 66 60)"/><circle cx="66" cy="60" r="3" fill="#79AEB8"/><text x="120" y="51" font-size="18" font-weight="bold" class="accent">DAILY COMMIT CLOCK</text><text x="120" y="78" font-size="14">Updated 2026-11-14 00:10 IST | Scheduled daily at 05:30 IST</text></g></svg>